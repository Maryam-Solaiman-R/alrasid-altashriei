services:
  - type: web
    name: regulatory-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONITOR_TOKEN
        generateValue: true
